
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Summary Component</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="main">

        <!-- Main card -->
        <section class="container">

            <!-- Hero image -->
            <img
                class="hero-image"
                src="./images/illustration-hero.svg"
                alt="Person enjoying music with headphones"
            >

            <!-- Card content -->
            <div class="content">

                <h1 class="heading">Order Summary</h1>

                <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

                <!-- Plan details -->
                <div class="plan">

                    <img
                        class="plan-icon"
                        src="./images/icon-music.svg"
                        alt=""
                    >

                   
                    <div class="plan-text">
                        <h3>Annual Plan</h3>
                        <p>$59.99/year</p>
                    </div>


                    <div class="change-link">
                        <a href="#">Change</a>
                    </div>

                </div>

                <!-- Payment button -->
                <button type="button" class="proceed-btn">
                    Proceed to Payment
                </button>

                <!-- Cancel link -->
                <a href="#" class="cancel-order">
                    Cancel Order
                </a>

            </div>

        </section>

        <!-- Footer -->
        <footer class="attribution">
            Challenge by
            <a
                href="https://www.crio.do"
                target="_blank"
                rel="noopener noreferrer"
            >Crio</a>.

            Coded by
            <a
                href="https://github.com/hkmahendra9"
                target="_blank"
                rel="noopener noreferrer"
            >Mahendra Manale</a>.
        </footer>

    </main>

</body>
</html>
